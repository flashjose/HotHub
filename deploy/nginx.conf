# HotHub nginx 站点配置
#
# 安装：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/hothub
#   sudo ln -sf /etc/nginx/sites-available/hothub /etc/nginx/sites-enabled/hothub
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 这是签证书**之前**的 HTTP 版本。跑过
#   sudo certbot --nginx -d hot.clashrose.cn --redirect
# 之后，certbot 会就地改写 /etc/nginx/sites-available/hothub：追加 443 server
# 块、挂上证书、把这里的 80 改成 301 跳转。届时服务器上的文件会与本文件不同，
# 那是正常的 —— 本文件只作为初始模板和重建时的参考。

server {
    listen 80;
    listen [::]:80;
    server_name hot.clashrose.cn;

    # 插件管理接口没有鉴权，POST /plugins/load 会按调用方给的路径 import 服务器上
    # 的 .py 文件。公网必须封死，需要热加载时从服务器本机 curl 127.0.0.1:8000 走。
    location ^~ /plugins/ {
        deny all;
    }

    # 上传体积封顶：本服务只有 GET 和几个小 JSON POST，不需要大 body。
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 缓存未命中时后端要现抓 7 个平台，首次请求可能十几秒，默认 60s 不够稳。
        proxy_connect_timeout 10s;
        proxy_read_timeout   120s;
        proxy_send_timeout   120s;
    }

    # /img 是封面图代理，后端已设 Cache-Control: public, max-age=86400，
    # 这里额外开启 nginx 侧的响应缓冲，减少后端连接占用。
    location /img {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_buffering on;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    # 图片不压缩：PNG/JPEG 已是压缩格式，再 gzip 只费 CPU。
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    access_log /var/log/nginx/hothub.access.log;
    error_log  /var/log/nginx/hothub.error.log;
}
